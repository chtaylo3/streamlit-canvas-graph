name: Approved contributors

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce:
    name: Enforce contributor approval
    runs-on: ubuntu-latest
    steps:
      - name: Close pull requests from unapproved contributors
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const approvedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const approvedBots = new Set(["dependabot[bot]"]);
            const pull = context.payload.pull_request;
            if (approvedAssociations.has(pull.author_association) || approvedBots.has(pull.user.login)) {
              return;
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pull.number,
              body: "Thanks for your interest. This repository currently accepts pull requests only from approved collaborators. Please open an issue to discuss a change with the maintainers first.",
            });
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pull.number,
              state: "closed",
            });
